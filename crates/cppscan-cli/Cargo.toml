[package]
name = "cppscan-cli"
version = "0.1.0"
edition = "2021"
description = "CLI for cppscan - high-performance C preprocessor dependency scanner"

[[bin]]
name = "cppscan"
path = "src/main.rs"

[dependencies]
cppscan = { path = "../.." }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1"
