[workspace]
members = [
    ".",
    "crates/ccdeps-cli",
]

[package]
name = "ccdeps"
version = "0.1.0"
edition = "2021"
description = "High-performance C preprocessor dependency scanner"
license = "MIT"
repository = "https://github.com/world-build/ccdeps"

[lib]
name = "ccdeps"

[dependencies]
dashmap = "6"
memmap2 = "0.9"
memchr = "2"

[dev-dependencies]
criterion = "0.5"
tempfile = "3"
rayon = "1"

[[bench]]
name = "scan"
harness = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
lto = true
